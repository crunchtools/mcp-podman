[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_podman_crunchtools/config.py"
justification = "_resolve_socket_path has five return points across six precedence branches. __init__ cannot return, so inlining forces a rewrite into nested if/elif assignment that is strictly harder to follow. Its branches are covered directly by tests/test_config.py::TestResolveSocketPath."
classification = "by_design"

[[exceptions]]
check = "copy_paste_detection"
path = "src/mcp_podman_crunchtools/client.py"
justification = "get_client and get_config are both the four-line lazy-singleton accessor: check the module global, construct if None, return. The duplication is the idiom; hiding it behind a generic obscures which global is being initialised."
classification = "by_design"

[[exceptions]]
check = "manifest_lint_suppression"
path = "pyproject.toml"
justification = "Reviewed each global ignore individually by removing it and running ruff (not by trusting the existing comments). PIE790 had zero remaining hits and was deleted outright — pure dead config. TRY003 fired only in config.py (4 sites, all ConfigurationError(f\"...\") — that class has no message template of its own, so there's no string to hoist) and is now a per-file-ignore scoped to that file only. PLR0913/PLR0917 fired only on container_create (containers.py) and its 1:1 MCP wrapper container_create_tool (server.py) — 6 args mirroring Podman's create-container wire API — and are now per-file-ignores scoped to those two files (verified each currently applies to exactly that one function per file; ruff has no finer-grained config-based scope than per-file). PLR2004 fired on 3 HTTP status literals in client.py and one mount-parsing literal in containers.py; all four were replaced with named constants (HTTP_NO_CONTENT/HTTP_NOT_FOUND/HTTP_CONFLICT, VOLUME_SPEC_WITH_OPTIONS_PARTS) so the rule is no longer ignored in src/ at all — kept ignored only for tests/*, where literal counts/timeouts in assertions don't warrant named constants. PLW0603 fired only on the two singleton accessors (get_client in client.py, get_config in config.py) and is now a per-file-ignore on each of those two files. RUF022 was fixed outright by sorting __all__ alphabetically via `ruff --fix`. The only ignore that is genuinely project-wide is TID252 (10 hits, every internal relative import across every tools/ module — this package's actual, consistent import convention). Inline `# noqa` was considered for the per-function cases but rejected: gourmand's own EV001-lint_suppression check flags inline noqa on sight, so per-file-ignores in pyproject.toml (reviewed here) is the correct channel gourmand expects for these narrow, verified cases."
classification = "by_design"

[[exceptions]]
check = "single_use_helpers"
path = "src/mcp_podman_crunchtools/client.py"
justification = "_check_response is a domain-specific named step (validate response size and status) called once from request(), alongside sibling steps _parse_response and _handle_error that decompose HTTP response handling into named, independently readable stages. It documents a real concept (response validation), not an extraction to dodge a complexity warning."
classification = "by_design"

[[exceptions]]
check = "absolute_paths"
path = "src/mcp_podman_crunchtools/config.py"
justification = "The rootless (under the user runtime dir) and rootful (under the system run dir) fallback socket locations are the standard, well-known filesystem locations for Podman's API sockets — Podman itself creates sockets at these fixed locations, so probing them directly (as a fallback after XDG_RUNTIME_DIR and the explicit env vars) is the correct way to auto-detect the socket, not a portability shortcut."
classification = "by_design"

[[exceptions]]
check = "absolute_paths"
path = "src/mcp_podman_crunchtools/client.py"
justification = "The volumes route-segment check here is a substring match against a Podman REST API error path (e.g. distinguishing a 404 on the volumes endpoint from one on the networks endpoint) to pick the right NotFoundError subclass — it is a URL route fragment, not an OS filesystem path."
classification = "by_design"

[[exceptions]]
check = "absolute_paths"
path = "src/mcp_podman_crunchtools/tools/system.py"
justification = "The system-df route is the literal Podman REST API endpoint path (a GET against the system disk-usage endpoint), not an OS filesystem path."
classification = "by_design"

[[exceptions]]
check = "absolute_paths"
path = "src/mcp_podman_crunchtools/tools/volumes.py"
justification = "The volumes-list and volumes-inspect routes are literal Podman REST API endpoint paths, not OS filesystem paths."
classification = "by_design"

[[exceptions]]
check = "absolute_paths"
path = "src/mcp_podman_crunchtools/__init__.py"
justification = "The rootful socket path appears only in the module docstring's usage example, showing the standard value a user would pass via the PODMAN_SOCKET env var — documentation text, not a hardcoded path used by the code."
